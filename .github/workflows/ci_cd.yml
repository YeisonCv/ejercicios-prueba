name: CI/CD

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - main

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-lastest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci 
      - run: npm run test:coverage

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci 
      - run: npm run build

  sonar:
    name: Sonar analisys
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci 
      - run: npm run test:coverage

      - name: SonarCloud Scan
        uses: sonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
